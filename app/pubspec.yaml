name: obd2app
description: "OBD2 vehicle diagnostics application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 3.4.2
  go_router: 17.5.0

  flutter_blue_plus: 2.3.12
  purchases_flutter: 10.9.0
  supabase_flutter: 2.17.1

  drift: 2.34.3
  drift_flutter: 0.3.1
  sqlite3: 3.5.1
  path: 1.9.1
  path_provider: 2.1.6
  flutter_secure_storage: 10.3.1

  pdf: 3.13.0
  printing: 5.15.0
  share_plus: 13.3.0
  intl: 0.20.3
  flutter_local_notifications: 22.3.0
  timezone: 0.11.1

  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: 2.34.0
  freezed: 3.2.5
  json_serializable: 6.14.1
  build_runner: 2.15.1
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
